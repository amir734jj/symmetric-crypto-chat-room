services:
  chat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - turn
    expose:
      - "3000"
    environment:
      - SERVICE_FQDN_CHAT_3000
      - ASPNETCORE_URLS=http://+:3000
      - TURN_HOST=${TURN_HOST:-}
      - TURN_SECRET=${TURN_SECRET:?TURN_SECRET must be set}
      - DATABASE_PATH=/app/data/db.litedb
    volumes:
      - chat-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    command:
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET must be set}
      - --realm=${TURN_REALM:-chat.coolify.hesamian.com}
      - --external-ip=${TURN_EXTERNAL_IP:?TURN_EXTERNAL_IP must be set}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --log-file=stdout

volumes:
  chat-data: