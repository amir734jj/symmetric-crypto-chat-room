name: Android latest APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-latest-release
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          chmod +x android/gradlew
          version_code="${GITHUB_RUN_NUMBER}"
          version_name="1.0.${GITHUB_RUN_NUMBER}"

          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
            export ANDROID_KEYSTORE_PATH="$GITHUB_WORKSPACE/Mobile/android/app/release.jks"
            android/gradlew -p android assembleRelease -PversionCode="$version_code" -PversionName="$version_name"
            cp android/app/build/outputs/apk/release/app-release.apk symmetric-crypto-chat-latest.apk
          else
            echo "Signing secrets are not configured; publishing a debug-signed APK."
            android/gradlew -p android assembleDebug -PversionCode="$version_code" -PversionName="$version_name"
            cp android/app/build/outputs/apk/debug/app-debug.apk symmetric-crypto-chat-latest.apk
          fi

      - name: Create or update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Android APK built from commit ${GITHUB_SHA}. Download symmetric-crypto-chat-latest.apk and allow installation from this source."
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            git tag --force latest "$GITHUB_SHA"
            git push origin refs/tags/latest --force
            gh release edit latest --repo "$GITHUB_REPOSITORY" --title "Latest Android APK" --notes "$notes" --latest
            gh release upload latest symmetric-crypto-chat-latest.apk --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create latest symmetric-crypto-chat-latest.apk --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Latest Android APK" --notes "$notes" --latest
          fi