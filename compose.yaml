services:
  chat:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - turn
    expose:
      - "3000"
    environment:
      ASPNETCORE_URLS: http://+:3000
      TURN_HOST: ${TURN_HOST:-turn.coolify.hesamian.com}
      TURN_SECRET: ${TURN_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    command:
      - --no-cli
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:-}
      - --realm=${TURN_REALM:-chat.coolify.hesamian.com}
      - --external-ip=${TURN_EXTERNAL_IP:-}
      - --listening-port=3478
      - --min-port=49160
      - --max-port=49200
      - --log-file=stdout